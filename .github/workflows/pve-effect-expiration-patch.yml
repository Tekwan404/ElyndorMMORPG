name: pve-effect-expiration-patch

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-effect-expiration-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_patch_effect_expiration_runtime.py
      - run: |
          git diff --check
          git diff -- src/Elyndor.Core/Combat/Effects/EffectEngine.cs src/Elyndor.Core/Combat/Sessions/CombatSession.cs
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Effects/EffectEngine.cs src/Elyndor.Core/Combat/Sessions/CombatSession.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Effects/EffectEngine.cs src/Elyndor.Core/Combat/Sessions/CombatSession.cs
          git commit -m "Execute dispellable effect expiration actions"
          git push origin HEAD:codex/pve-mechanics-v022
