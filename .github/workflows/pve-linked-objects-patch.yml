name: pve-linked-objects-patch

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-linked-objects-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_patch_linked_objects.py
      - run: git diff --check
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Encounters/EncounterModels.cs src/Elyndor.Core/Combat/Encounters/LinkedSummonRegistry.cs src/Elyndor.Core/Combat/Sessions/CombatSessionModels.cs src/Elyndor.Core/Combat/Sessions/CombatSession.EncounterSupport.cs src/Elyndor.Core/Combat/Sessions/CombatSession.GenericEncounter.cs src/Elyndor.Core/Content/Validation/EncounterContentValidator.cs src/Elyndor.Core/Combat/Sessions/CombatSession.cs src/Elyndor.Infrastructure/Progression/CombatRewardService.cs src/Elyndor.Infrastructure/Professions/ProfessionService.cs tests/Elyndor.UnitTests/Combat/CombatSessionGenericEncounterTests.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Encounters/EncounterModels.cs src/Elyndor.Core/Combat/Encounters/LinkedSummonRegistry.cs src/Elyndor.Core/Combat/Sessions/CombatSessionModels.cs src/Elyndor.Core/Combat/Sessions/CombatSession.EncounterSupport.cs src/Elyndor.Core/Combat/Sessions/CombatSession.GenericEncounter.cs src/Elyndor.Core/Content/Validation/EncounterContentValidator.cs src/Elyndor.Core/Combat/Sessions/CombatSession.cs src/Elyndor.Infrastructure/Progression/CombatRewardService.cs src/Elyndor.Infrastructure/Professions/ProfessionService.cs tests/Elyndor.UnitTests/Combat/CombatSessionGenericEncounterTests.cs
          git commit -m "Add linked combat objects and reward eligibility"
          git push origin HEAD:codex/pve-mechanics-v022
