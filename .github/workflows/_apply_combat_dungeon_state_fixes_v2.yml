name: apply combat dungeon state fixes v2

on:
  push:
    branches:
      - fix/combat-dungeon-state-2026-09-11

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[patched-combat-state]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: elyndor_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d elyndor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/combat-dungeon-state-2026-09-11

      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}\nOLD:\n{old[:700]}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'web/elyndor-web/src/game/world/views/WorldView.vue',
              "? 'Отдых в городе: здоровье восстанавливается со скоростью 5% от максимального здоровья в секунду.'\n      : 'Вне города здоровье восстанавливается со скоростью 1% от максимального здоровья в секунду.'",
              "? 'Отдых в городе: здоровье восстанавливается со скоростью 15% от максимального здоровья в секунду.'\n      : 'Вне города здоровье восстанавливается со скоростью 10% от максимального здоровья в секунду.'")

          replace_once(
              'src/Elyndor.Infrastructure/Combat/CombatApplicationService.cs',
              "return session.Handle(\n                    characterId,\n                    new UseAbilityCommand(commandId, abilityId, Guid.Empty),\n                    now);",
              "return session.HandleAbilityInterruptingAutoAttack(\n                    characterId,\n                    new UseAbilityCommand(commandId, abilityId, Guid.Empty),\n                    now);")

          replace_once(
              'src/Elyndor.Core/Combat/Sessions/CombatSession.cs',
              "if (isOffHand)\n            _nextPlayerOffHandAutoAttackAtUtc = _playerRuntime.ActiveCast.ResolvesAtUtc;\n        else\n            _nextPlayerMainHandAutoAttackAtUtc = _playerRuntime.ActiveCast.ResolvesAtUtc;",
              "DateTimeOffset restartAtUtc = _playerRuntime.ActiveCast.ResolvesAtUtc;\n        DateTimeOffset nextAfterCast = restartAtUtc\n            + EffectivePlayerAutoAttackInterval(profile, restartAtUtc);\n        if (isOffHand)\n            _nextPlayerOffHandAutoAttackAtUtc = nextAfterCast;\n        else\n            _nextPlayerMainHandAutoAttackAtUtc = nextAfterCast;")

          endpoints = 'src/Elyndor.Server/Dungeons/DungeonEndpoints.cs'
          replace_once(endpoints,
              "using Elyndor.Infrastructure.Persistence;\nusing Microsoft.EntityFrameworkCore;",
              "using Elyndor.Infrastructure.Persistence;\nusing Elyndor.Infrastructure.World;\nusing Microsoft.EntityFrameworkCore;")
          replace_once(endpoints,
              "private static async Task<IResult> TeleportAsync(\n        TeleportToDungeonRequest request,\n        ClaimsPrincipal user,\n        DungeonService service,\n        PartyService partyService,\n        GameDbContext dbContext,",
              "private static async Task<IResult> TeleportAsync(\n        TeleportToDungeonRequest request,\n        ClaimsPrincipal user,\n        DungeonService service,\n        PartyService partyService,\n        BootstrapService bootstrapService,\n        GameDbContext dbContext,")
          replace_once(endpoints,
              "service,\n                partyService,\n                dbContext,",
              "service,\n                partyService,\n                bootstrapService,\n                dbContext,")
          replace_once(endpoints,
              "private static async Task<DungeonTeleportResult> TeleportPartyToEntryAsync(\n        Guid accountId,\n        string dungeonId,\n        Guid requestId,\n        DungeonService service,\n        PartyService partyService,\n        GameDbContext dbContext,",
              "private static async Task<DungeonTeleportResult> TeleportPartyToEntryAsync(\n        Guid accountId,\n        string dungeonId,\n        Guid requestId,\n        DungeonService service,\n        PartyService partyService,\n        BootstrapService bootstrapService,\n        GameDbContext dbContext,")
          replace_once(endpoints,
              "if (party is null)\n            return await service.TeleportToEntryAsync(accountId, dungeonId, requestId, cancellationToken);",
              "if (party is null)\n        {\n            await bootstrapService.GetAsync(accountId, cancellationToken, checkpoint: true);\n            return await service.TeleportToEntryAsync(accountId, dungeonId, requestId, cancellationToken);\n        }")
          replace_once(endpoints,
              "int healthyMemberCount = await dbContext.CharacterVitals",
              "foreach (var member in members)\n        {\n            await bootstrapService.GetAsync(member.AccountId, cancellationToken, checkpoint: true);\n        }\n\n        int healthyMemberCount = await dbContext.CharacterVitals")

          replace_once(
              'src/Elyndor.Infrastructure/Combat/CombatApplicationService.cs',
              "if (dungeonService is null)\n            return Failure(CombatErrorCodes.DungeonUnavailable);\n\n        (DungeonPreparation? preparation, string? errorCode) =",
              "if (dungeonService is null)\n            return Failure(CombatErrorCodes.DungeonUnavailable);\n\n        if (bootstrapService is not null)\n        {\n            await bootstrapService.GetAsync(\n                accountId,\n                contentProvider.GetCurrent(),\n                cancellationToken,\n                checkpoint: true);\n        }\n\n        (DungeonPreparation? preparation, string? errorCode) =")

          replace_once(
              'src/Elyndor.Infrastructure/Dungeons/DungeonService.cs',
              "DungeonRun? existing = await LoadActiveRunAsync(ownerId, cancellationToken);\n        if (existing is not null)\n        {\n            await CommitAsync(transaction, cancellationToken);\n            if (!string.Equals(existing.DungeonId, definition.Id, StringComparison.Ordinal))\n                return DungeonOperationResult.Failure(DungeonErrorCodes.RunAlreadyActive);\n            return new DungeonOperationResult(true, null, ToView(existing, definition));\n        }",
              "DungeonRun? existing = await LoadActiveRunAsync(ownerId, cancellationToken);\n        if (existing is not null)\n        {\n            if (string.Equals(existing.DungeonId, definition.Id, StringComparison.Ordinal))\n            {\n                await CommitAsync(transaction, cancellationToken);\n                return new DungeonOperationResult(true, null, ToView(existing, definition));\n            }\n\n            if (existing.Encounters.Any(encounter => encounter.State == DungeonEncounterState.Active))\n            {\n                await CommitAsync(transaction, cancellationToken);\n                return DungeonOperationResult.Failure(DungeonErrorCodes.RunAlreadyActive);\n            }\n\n            existing.Abandon();\n            foreach (DungeonRunMember member in existing.Members\n                         .Where(member => member.State == DungeonRunMemberState.Active))\n            {\n                member.MarkLeft();\n            }\n            await dbContext.SaveChangesAsync(cancellationToken);\n        }")

          store = 'web/elyndor-web/src/stores/combatSession.ts'
          replace_once(store,
              "const pending = ref(false)\n  const trainingStats",
              "const pending = ref(false)\n  const abilityQueue = ref<string[]>([])\n  const trainingStats")
          replace_once(store,
              "let lootRefreshTimer: number | null = null\n  const retryCommandIds",
              "let lootRefreshTimer: number | null = null\n  let abilityQueueTimer: number | null = null\n  let abilitySending = false\n  const retryCommandIds")
          replace_once(store,
              "  async function useAbility(abilityId: string): Promise<void> {\n    if (!snapshot.value) return\n    const sessionId = snapshot.value.sessionId\n    await invokeRetryableCommand(\n      `UseAbility:${sessionId}:${abilityId}`,\n      commandId => invokeWithOutcome('UseAbility', sessionId, abilityId, commandId),\n    )\n  }\n",
              "  async function useAbility(abilityId: string): Promise<void> {\n    const current = snapshot.value\n    if (!current || current.status !== 'Active') return\n    if (!current.player.abilities.some((ability) => ability.id === abilityId)) return\n    if (abilityQueue.value.length >= 3) return\n    abilityQueue.value = [...abilityQueue.value, abilityId]\n    scheduleAbilityQueueDrain()\n  }\n\n  function scheduleAbilityQueueDrain(delayMs = 0): void {\n    if (abilityQueueTimer !== null) window.clearTimeout(abilityQueueTimer)\n    abilityQueueTimer = window.setTimeout(() => {\n      abilityQueueTimer = null\n      void drainAbilityQueue()\n    }, Math.max(0, delayMs))\n  }\n\n  async function drainAbilityQueue(): Promise<void> {\n    const current = snapshot.value\n    if (abilitySending || pending.value || abilityQueue.value.length === 0) {\n      if (abilityQueue.value.length > 0) scheduleAbilityQueueDrain(20)\n      return\n    }\n    if (!current || current.status !== 'Active') {\n      clearAbilityQueue()\n      return\n    }\n\n    const cast = current.player.activeCast\n    if (cast) {\n      scheduleAbilityQueueDrain(Math.max(15, Date.parse(cast.resolvesAtUtc) - Date.now() + 25))\n      return\n    }\n\n    const abilityId = abilityQueue.value[0]!\n    const ability = current.player.abilities.find((candidate) => candidate.id === abilityId)\n    if (!ability) {\n      abilityQueue.value = abilityQueue.value.slice(1)\n      scheduleAbilityQueueDrain()\n      return\n    }\n\n    const readyAt = current.player.cooldowns[abilityId]\n    if (readyAt && Date.parse(readyAt) > Date.now()) {\n      scheduleAbilityQueueDrain(Math.max(15, Date.parse(readyAt) - Date.now() + 25))\n      return\n    }\n\n    abilitySending = true\n    const sessionId = current.sessionId\n    try {\n      await invokeRetryableCommand(\n        `UseAbility:${sessionId}:${abilityId}`,\n        commandId => invokeWithOutcome('UseAbility', sessionId, abilityId, commandId),\n      )\n      abilityQueue.value = abilityQueue.value.slice(1)\n    } finally {\n      abilitySending = false\n      if (abilityQueue.value.length > 0) scheduleAbilityQueueDrain()\n    }\n  }\n\n  function clearAbilityQueue(): void {\n    abilityQueue.value = []\n    if (abilityQueueTimer !== null) {\n      window.clearTimeout(abilityQueueTimer)\n      abilityQueueTimer = null\n    }\n  }\n")
          replace_once(store,
              "        retryCommandIds.clear()\n        clearLootRolls()\n        errorCode.value = null",
              "        retryCommandIds.clear()\n        clearAbilityQueue()\n        clearLootRolls()\n        errorCode.value = null")
          replace_once(store,
              "      retryCommandIds.clear()\n      clearLootRolls()\n    }\n    return succeeded",
              "      retryCommandIds.clear()\n      clearAbilityQueue()\n      clearLootRolls()\n    }\n    return succeeded")
          replace_once(store,
              "      retryCommandIds.clear()\n      snapshot.value = null",
              "      retryCommandIds.clear()\n      clearAbilityQueue()\n      snapshot.value = null")
          replace_once(store,
              "    if (incomingSnapshot && incomingSnapshot.status !== 'Active') {\n      retryCommandIds.clear()\n    }",
              "    if (incomingSnapshot && incomingSnapshot.status !== 'Active') {\n      retryCommandIds.clear()\n      clearAbilityQueue()\n    }")
          replace_once(store,
              "    if (update.reward) {\n      reward.value = update.reward\n      if (update.reward.lootRolls?.length) mergeLootRolls(update.reward.lootRolls)\n    }\n  }",
              "    if (update.reward) {\n      reward.value = update.reward\n      if (update.reward.lootRolls?.length) mergeLootRolls(update.reward.lootRolls)\n    }\n    if (abilityQueue.value.length > 0) scheduleAbilityQueueDrain()\n  }")
          replace_once(store,
              "    pending,\n    isActive,",
              "    pending,\n    abilityQueue,\n    isActive,")

          view = 'web/elyndor-web/src/game/combat/views/CombatView.vue'
          replace_once(view, "type LogSide = 'player' | 'enemy' | 'system'", "type LogSide = 'player' | 'ally' | 'enemy' | 'system'")
          replace_once(view, "  detail?: string\n}", "  detail?: string\n  occurredAtUtc: string\n}")
          replace_once(view,
              "const combatPlayers = computed(() => snapshot.value?.players ?? (snapshot.value ? [snapshot.value.player] : []))\nconst isParticipantActive",
              "const combatPlayers = computed(() => snapshot.value?.players ?? (snapshot.value ? [snapshot.value.player] : []))\nconst combatAllies = computed(() => combatPlayers.value.filter((player) => player.actorId !== snapshot.value?.player.actorId))\nconst companion = computed(() => snapshot.value?.companion ?? null)\nconst companionArt = computed(() => monsterArtUrl(companion.value?.artId))\nconst isParticipantActive")
          replace_once(view,
              "      detail: resourceEvent\n        ? `${resourceEvent.amount > 0 ? '+' : ''}${Math.round(resourceEvent.amount * 10) / 10} ${resourceName.value.toLowerCase()} · ${abilityName(resourceEvent.definitionId)}`\n        : undefined,\n    })",
              "      detail: resourceEvent\n        ? `${resourceEvent.amount > 0 ? '+' : ''}${Math.round(resourceEvent.amount * 10) / 10} ${resourceName.value.toLowerCase()} · ${abilityName(resourceEvent.definitionId)}`\n        : undefined,\n      occurredAtUtc: event.serverTimeUtc,\n    })")
          replace_once(view,
              "const recentFeedback = computed(() =>\n  logEntries.value.find((entry) => entry.side !== 'system') ?? logEntries.value[0] ?? null,\n)",
              "const recentFeedback = computed(() => {\n  const entry = logEntries.value.find((candidate) => candidate.side !== 'system') ?? logEntries.value[0] ?? null\n  if (!entry) return null\n  return now.value - Date.parse(entry.occurredAtUtc) <= 4_500 ? entry : null\n})")
          replace_once(view,
              "  if (source === current.player.actorId) return 'player'\n  if (combatEnemies.value.some((enemy) => enemy.actorId === source)) return 'enemy'",
              "  if (source === current.player.actorId) return 'player'\n  if (current.companion?.actorId === source) return 'ally'\n  if (combatEnemies.value.some((enemy) => enemy.actorId === source)) return 'enemy'")
          replace_once(view,
              "  if (side === 'player') return 'ВЫ'\n  if (side === 'enemy') {",
              "  if (side === 'player') return 'ВЫ'\n  if (side === 'ally') return companion.value?.name.toUpperCase() ?? 'СПУТНИК'\n  if (side === 'enemy') {")
          replace_once(view, "        v-if=\"combatPlayers.length > 1\"\n        class=\"combat-party-roster\"", "        v-if=\"combatAllies.length > 0\"\n        class=\"combat-party-roster\"")
          replace_once(view, "<strong>Слаженный отряд · {{ combatPlayers.length }}</strong>", "<strong>Союзники · {{ combatAllies.length }}</strong>")
          replace_once(view, "v-for=\"player in combatPlayers\"", "v-for=\"player in combatAllies\"")
          replace_once(view,
              "        <div class=\"player-figure\" aria-hidden=\"true\">\n          <img v-if=\"playerArt\" :src=\"playerArt\" alt=\"\" />\n          <div v-else class=\"player-figure__fallback\">\n            {{ snapshot.player.definitionId.slice(0, 1) }}\n          </div>\n        </div>\n",
              "        <div class=\"player-figure\" aria-hidden=\"true\">\n          <img v-if=\"playerArt\" :src=\"playerArt\" alt=\"\" />\n          <div v-else class=\"player-figure__fallback\">\n            {{ snapshot.player.definitionId.slice(0, 1) }}\n          </div>\n        </div>\n\n        <div v-if=\"companion\" class=\"companion-figure\" :data-dead=\"companion.hp <= 0\">\n          <div class=\"companion-figure__portrait\">\n            <img v-if=\"companionArt\" :src=\"companionArt\" alt=\"\" />\n            <IconGenerator v-else :config=\"{ id: `companion-${companion.actorId}`, glyph: 'star', category: 'utility' }\" />\n          </div>\n          <div class=\"companion-figure__state\">\n            <strong>{{ companion.name }}</strong>\n            <i><span :style=\"{ width: `${combatPlayerHealthRatio(companion)}%` }\" /></i>\n            <small>{{ Math.ceil(companion.hp) }} / {{ Math.ceil(companion.maxHp) }}</small>\n          </div>\n        </div>\n")
          replace_once(view,
              ":class=\"{ 'ability-slot--empty': !ability, 'ability-slot--comet': ability?.id === 'FIRE_COMET' }\"",
              ":class=\"{ 'ability-slot--empty': !ability, 'ability-slot--comet': ability?.id === 'FIRE_COMET', 'ability-slot--queued': ability && combat.abilityQueue.includes(ability.id) }\"")
          replace_once(view, ":disabled=\"!ability || combat.pending || abilityState(ability) !== 'ready'\"", ":disabled=\"!ability || abilityState(ability) !== 'ready'\"")
          replace_once(view,
              "            <span v-if=\"ability?.id === 'COMBUSTION' && combustion\" class=\"ability-slot__proc\" aria-label=\"Возгорание активно\">АКТ.</span>",
              "            <span v-if=\"ability?.id === 'COMBUSTION' && combustion\" class=\"ability-slot__proc\" aria-label=\"Возгорание активно\">АКТ.</span>\n            <span v-if=\"ability && combat.abilityQueue.includes(ability.id)\" class=\"ability-slot__queue\">{{ combat.abilityQueue.indexOf(ability.id) + 1 }}</span>")
          replace_once(view,
              ".player-figure__fallback {",
              ".companion-figure {\n  position: absolute;\n  bottom: .6rem;\n  left: 7.6rem;\n  z-index: 3;\n  display: grid;\n  grid-template-columns: 2.5rem minmax(5rem, 1fr);\n  align-items: center;\n  gap: 6px;\n  max-width: 10rem;\n  padding: 5px 7px;\n  border: 1px solid rgb(79 185 150 / 34%);\n  border-radius: var(--ui-radius-md);\n  background: rgb(5 12 14 / 84%);\n  backdrop-filter: blur(6px);\n}\n.companion-figure[data-dead='true'] { opacity: .48; }\n.companion-figure__portrait { display: grid; width: 2.5rem; height: 2.5rem; place-items: center; overflow: hidden; border-radius: 50%; background: rgb(79 185 150 / 12%); color: #9be2c9; }\n.companion-figure__portrait img { width: 100%; height: 100%; object-fit: contain; }\n.companion-figure__state { display: grid; min-width: 0; gap: 2px; }\n.companion-figure__state strong { overflow: hidden; font-size: .55rem; text-overflow: ellipsis; white-space: nowrap; }\n.companion-figure__state small { color: var(--ui-color-text-muted); font-size: .44rem; }\n.companion-figure__state i { display: block; height: 4px; overflow: hidden; border-radius: 999px; background: rgb(0 0 0 / 55%); }\n.companion-figure__state i span { display: block; height: 100%; background: #4fb996; }\n\n.player-figure__fallback {")
          replace_once(view,
              ".combat-feedback[data-side='player'] {\n  color: #d1ccff;\n}",
              ".combat-feedback[data-side='player'] {\n  color: #d1ccff;\n}\n.combat-feedback[data-side='ally'] { color: #9be2c9; }")
          replace_once(view,
              ".training-stats {\n  display: grid;",
              ".ability-slot--queued { border-color: rgb(155 226 201 / 55%); box-shadow: inset 0 0 0 1px rgb(155 226 201 / 18%); }\n.ability-slot__queue { position: absolute; top: 3px; left: 3px; display: grid; width: 1rem; height: 1rem; place-items: center; border-radius: 50%; background: #9be2c9; color: #07110e; font-size: .48rem; font-weight: 900; }\n\n.training-stats {\n  display: grid;")
          replace_once(view, ".ability-slot {\n", ".ability-slot {\n  position: relative;\n")
          PY

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/elyndor-web/package-lock.json

      - name: Verify backend
        run: |
          dotnet restore Elyndor.slnx
          dotnet build Elyndor.slnx --configuration Release --no-restore
          dotnet test Elyndor.slnx --configuration Release --no-build
          dotnet run --project tools/Elyndor.ContentValidator --configuration Release --no-build -- content/package.json

      - name: Verify frontend
        working-directory: web/elyndor-web
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npm run build

      - name: Commit verified patch
        run: |
          rm .github/workflows/_apply_combat_dungeon_state_fixes_v2.yml
          git config user.name "elyndor-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize combat and dungeon state [patched-combat-state]"
          git push origin HEAD:fix/combat-dungeon-state-2026-09-11
