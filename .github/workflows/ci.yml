name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: elyndor_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elyndor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Sync itemization EF snapshots
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/itemization-v2-enhancement'
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path("src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextModelSnapshot.cs"),
              Path("src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextProfessionModelSnapshot.cs"),
          ]
          property_anchor = '''                    b.Property<Guid>("CharacterId")
                        .HasColumnType("uuid");

                    b.Property<DateTimeOffset>("CreatedAtUtc")
                        .HasColumnType("timestamp with time zone");
'''
          property_replacement = '''                    b.Property<string>("CatalystItemId")
                        .HasMaxLength(64)
                        .HasColumnType("character varying(64)");

                    b.Property<int>("CatalystQuantity")
                        .ValueGeneratedOnAdd()
                        .HasColumnType("integer")
                        .HasDefaultValue(0);

                    b.Property<Guid>("CharacterId")
                        .HasColumnType("uuid");

                    b.Property<DateTimeOffset>("CreatedAtUtc")
                        .HasColumnType("timestamp with time zone");

                    b.Property<string>("EnhancementMaterialItemId")
                        .HasMaxLength(64)
                        .HasColumnType("character varying(64)");

                    b.Property<int>("EnhancementMaterialQuantity")
                        .ValueGeneratedOnAdd()
                        .HasColumnType("integer")
                        .HasDefaultValue(0);
'''
          constraint_anchor = '''                    b.ToTable("item_salvage_operations", "game", t =>
                        {
                            t.HasCheckConstraint("ck_item_salvage_operations_material", "\\\"MaterialQuantity\\\" >= 0");

                            t.HasCheckConstraint("ck_item_salvage_operations_stones", "\\\"ReforgeStoneQuantity\\\" > 0");
                        });
'''
          constraint_replacement = '''                    b.ToTable("item_salvage_operations", "game", t =>
                        {
                            t.HasCheckConstraint("ck_item_salvage_operations_catalyst", "\\\"CatalystQuantity\\\" >= 0");

                            t.HasCheckConstraint("ck_item_salvage_operations_enhancement_material", "\\\"EnhancementMaterialQuantity\\\" >= 0");

                            t.HasCheckConstraint("ck_item_salvage_operations_material", "\\\"MaterialQuantity\\\" >= 0");

                            t.HasCheckConstraint("ck_item_salvage_operations_stones", "\\\"ReforgeStoneQuantity\\\" > 0");
                        });
'''

          changed = False
          for path in paths:
              text = path.read_text(encoding="utf-8-sig")
              entity_start = text.index('modelBuilder.Entity("Elyndor.Core.Items.ItemSalvageOperation"')
              entity_end = text.index('modelBuilder.Entity(', entity_start + 20)
              block = text[entity_start:entity_end]

              if 'b.Property<string>("EnhancementMaterialItemId")' not in block:
                  if property_anchor not in block:
                      raise SystemExit(f"property anchor missing in {path}")
                  block = block.replace(property_anchor, property_replacement, 1)
                  changed = True

              if 'ck_item_salvage_operations_enhancement_material' not in block:
                  if constraint_anchor not in block:
                      raise SystemExit(f"constraint anchor missing in {path}")
                  block = block.replace(constraint_anchor, constraint_replacement, 1)
                  changed = True

              text = text[:entity_start] + block + text[entity_end:]
              path.write_text(text, encoding="utf-8")

          if not changed:
              print("Snapshots already synchronized.")

      - name: Commit synchronized snapshots
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/itemization-v2-enhancement'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextModelSnapshot.cs \
                  src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextProfessionModelSnapshot.cs
          git commit -m "fix(itemization): sync salvage refund EF snapshots"
          git push origin HEAD:feat/itemization-v2-enhancement

      - name: Check dev launcher syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/dev/Elyndor.ps1'),
            [ref]$tokens,
            [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Check production deploy scripts
        run: bash -n deploy/*.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/elyndor-web/package-lock.json
            web/elyndor-admin/package-lock.json

      - name: Restore backend
        run: dotnet restore Elyndor.slnx

      - name: Build backend
        run: dotnet build Elyndor.slnx --configuration Release --no-restore

      - name: Test backend
        run: dotnet test Elyndor.slnx --configuration Release --no-build

      - name: Validate game content
        run: dotnet run --project tools/Elyndor.ContentValidator --configuration Release --no-build -- content/package.json

      - name: Install frontend dependencies
        working-directory: web/elyndor-web
        run: npm ci

      - name: Check frontend
        working-directory: web/elyndor-web
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Install admin frontend dependencies
        working-directory: web/elyndor-admin
        run: npm ci

      - name: Check admin frontend
        working-directory: web/elyndor-admin
        run: |
          npm run lint
          npm run test:unit
          npm run build

      - name: Validate production publish layout
        run: |
          rm -rf .artifacts/production
          dotnet publish src/Elyndor.Server/Elyndor.Server.csproj \
            --configuration Release \
            --no-restore \
            --self-contained false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            --output .artifacts/production
          mkdir -p .artifacts/production/frontend .artifacts/production/frontend-admin
          cp -a web/elyndor-web/dist/. .artifacts/production/frontend/
          cp -a web/elyndor-admin/dist/. .artifacts/production/frontend-admin/
          test -f .artifacts/production/Elyndor.Server.dll
          test -f .artifacts/production/frontend/index.html
          test -f .artifacts/production/content/package.json
          test -f .artifacts/production/content/dungeons/eclipsed-citadel.json

      - name: Install Playwright Chromium
        working-directory: web/elyndor-web
        run: npx playwright install chromium

      - name: Start real E2E server
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__game: Host=127.0.0.1;Port=5432;Database=elyndor_e2e;Username=postgres;Password=postgres
          Database__MigrateOnStartup: "true"
          Content__RestorePublishedOnStartup: "false"
          Authentication__Issuer: Elyndor.CI
          Authentication__Audience: Elyndor.CI.Client
          Authentication__SigningKey: ci-e2e-signing-key-with-more-than-thirty-two-bytes
          Authentication__Telegram__BotToken: 123456:CI_TEST_TOKEN
          Authentication__Development__Enabled: "true"
          Authentication__Development__TelegramUserId: "9000001"
        run: |
          dotnet .artifacts/production/Elyndor.Server.dll > .artifacts/e2e-server.log 2>&1 &
          echo $! > .artifacts/e2e-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5080/api/v1/status > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .artifacts/e2e-server.log
          exit 1

      - name: Test real Browser to Server to PostgreSQL flow
        working-directory: web/elyndor-web
        env:
          ELYNDOR_E2E_REAL: "true"
          ELYNDOR_E2E_BASE_URL: http://127.0.0.1:5080
        run: npm run test:e2e

      - name: Print E2E server log on failure
        if: failure()
        run: cat .artifacts/e2e-server.log || true
