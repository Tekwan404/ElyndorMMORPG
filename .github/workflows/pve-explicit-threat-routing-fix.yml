name: pve-explicit-threat-routing-fix

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-explicit-threat-routing-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_fix_explicit_threat_routing.py
      - run: git diff --check
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Sessions/CombatSession.Threat.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Sessions/CombatSession.Threat.cs
          git commit -m "Keep explicit threat actions out of legacy suppression"
          git push origin HEAD:codex/pve-mechanics-v022
