name: package-production

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: package-production-main
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.ELYNDOR_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ELYNDOR_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.ELYNDOR_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.ELYNDOR_DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.ELYNDOR_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout green revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Select successful main CI run for exact revision
        id: verified_ci
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if [[ -n "$TRIGGER_RUN_ID" ]]; then
            run_id="$TRIGGER_RUN_ID"
          else
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&head_sha=$revision&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo 'No successful main CI run for this revision; run CI first.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > .artifacts-ci-run.json
          jq -e --arg sha "$revision" '.conclusion == "success" and .event == "push" and .head_branch == "main" and .head_sha == $sha' .artifacts-ci-run.json > /dev/null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download tested production release (no rebuild)
        uses: actions/download-artifact@v8
        with:
          name: elyndor-linux-x64
          path: artifacts/production
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified_ci.outputs.run_id }}

      - name: Validate downloaded revision and checksums
        run: python3 deploy/release-manifest.py verify artifacts/production "$(git rev-parse HEAD)"

      - name: Detect automatic deployment configuration
        id: deploy
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "port=22" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS auto-deploy is not configured. Add ELYNDOR_DEPLOY_HOST, ELYNDOR_DEPLOY_USER and ELYNDOR_DEPLOY_SSH_KEY repository secrets."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: >-
          steps.deploy.outputs.enabled == 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          PORT: ${{ steps.deploy.outputs.port }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/elyndor_deploy
          chmod 600 ~/.ssh/elyndor_deploy

          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H -p "$PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release to VPS
        id: deploy_release
        if: >-
          steps.deploy.outputs.enabled == 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          PORT: ${{ steps.deploy.outputs.port }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$latest" == "$revision" ]] || { echo 'Refusing outdated release: main has advanced.' >&2; exit 1; }
          ssh_args=(-i ~/.ssh/elyndor_deploy -p "$PORT" -o BatchMode=yes)
          # The validated commit is deliberately expanded locally, not by the VPS shell.
          # shellcheck disable=SC2029
          remote_tree="$(ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "mktemp -d /tmp/elyndor-${revision}.XXXXXXXX")"
          [[ "$remote_tree" =~ ^/tmp/elyndor-${revision}\.[a-zA-Z0-9]+$ ]] || exit 1
          trap 'ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '\''$remote_tree'\''" || true' EXIT
          rsync -rltz --checksum --delete --stats --no-perms --no-owner --no-group \
            --copy-dest=/opt/elyndor/current \
            -e "ssh -i $HOME/.ssh/elyndor_deploy -p $PORT -o BatchMode=yes" \
            artifacts/production/ "$DEPLOY_USER@$DEPLOY_HOST:$remote_tree/"
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/elyndor-deploy-release '$remote_tree' '$revision' && test \"\$(cat /opt/elyndor/current/REVISION)\" = '$revision'"

          echo "Deployed Elyndor revision $revision to $DEPLOY_HOST"

      - name: Notify Telegram about deployment
        if: >-
          always() &&
          steps.deploy.outputs.enabled == 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        continue-on-error: true
        shell: bash
        env:
          PORT: ${{ steps.deploy.outputs.port }}
          DEPLOY_OUTCOME: ${{ steps.deploy_release.outcome }}
          JOB_STATUS: ${{ job.status }}
          FALLBACK_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail

          revision="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$FALLBACK_REVISION")"
          short_revision="${revision:0:7}"
          subject="$(git log -1 --pretty=%s 2>/dev/null || printf '%s' 'Unknown revision')"
          actions_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "${DEPLOY_OUTCOME:-}" == "success" ]]; then
            message=$'🟢 Elyndor обновлён\n'
            message+="Версия: ${short_revision}"$'\n'
            message+="${subject}"$'\n'
            message+=$'Сервер: ✅ ready'
          elif [[ "${JOB_STATUS:-}" == "failure" ]]; then
            message=$'🔴 Elyndor: ошибка обновления\n'
            message+="Версия: ${short_revision}"$'\n'
            message+="${subject}"$'\n'
            message+="GitHub Actions: ${actions_url}"
          else
            echo "::notice::Deployment was not attempted; Telegram notification skipped."
            exit 0
          fi

          message_b64="$(printf '%s' "$message" | base64 -w0)"
          ssh_args=(-i ~/.ssh/elyndor_deploy -p "$PORT" -o BatchMode=yes)

          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$message_b64" <<'REMOTE'
          set -euo pipefail

          message_b64="$1"
          env_file="/etc/elyndor/elyndor.env"
          appsettings_file="/opt/elyndor/current/appsettings.json"

          if [[ ! -r "$env_file" ]]; then
            echo "Elyndor server environment file is not readable: $env_file" >&2
            exit 1
          fi

          if [[ ! -r "$appsettings_file" ]]; then
            echo "Elyndor deployed appsettings is not readable: $appsettings_file" >&2
            exit 1
          fi

          set -a
          # shellcheck disable=SC1090
          . "$env_file"
          set +a

          bot_token="${Authentication__Telegram__BotToken:-}"
          if [[ -z "$bot_token" || "$bot_token" == "CHANGE_ME" ]]; then
            echo "Authentication__Telegram__BotToken is not configured on the VPS." >&2
            exit 1
          fi

          chat_id="$(python3 - "$appsettings_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as stream:
              settings = json.load(stream)

          value = settings.get("Administration", {}).get("Telegram", {}).get("ChatId", 0)
          print(value if value else "")
          PY
          )"

          if [[ -z "$chat_id" || "$chat_id" == "0" ]]; then
            echo "Administration:Telegram:ChatId is not configured in the deployed appsettings." >&2
            exit 1
          fi

          message="$(printf '%s' "$message_b64" | base64 -d)"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(curl --silent --show-error \
            --max-time 7 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -X POST \
            "https://api.telegram.org/bot${bot_token}/sendMessage" \
            --data-urlencode "chat_id=${chat_id}" \
            --data-urlencode "text=${message}")" || http_code="000"

          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            description="$(python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], "r", encoding="utf-8") as stream:
                  payload = json.load(stream)
              print(payload.get("description", "unknown Telegram error"))
          except Exception:
              print("unknown Telegram error")
          PY
          )"
            echo "Telegram notification failed from VPS runtime config (HTTP ${http_code}): ${description}" >&2
            exit 1
          fi

          echo "Telegram deployment notification sent from VPS runtime config to ${chat_id}."
          REMOTE
