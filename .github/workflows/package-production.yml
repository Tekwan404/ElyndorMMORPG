name: package-production

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: package-production-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_HOST: ${{ secrets.ELYNDOR_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.ELYNDOR_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.ELYNDOR_DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.ELYNDOR_DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.ELYNDOR_DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Checkout green revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/elyndor-web/package-lock.json
            web/elyndor-admin/package-lock.json

      - name: Build production release
        run: ./deploy/build-release.sh artifacts/elyndor-linux-x64.tar.gz

      - name: Upload production release
        uses: actions/upload-artifact@v7
        with:
          name: elyndor-linux-x64
          path: artifacts/elyndor-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Detect automatic deployment configuration
        id: deploy
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "port=22" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS auto-deploy is not configured. Add ELYNDOR_DEPLOY_HOST, ELYNDOR_DEPLOY_USER and ELYNDOR_DEPLOY_SSH_KEY repository secrets."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        if: >-
          steps.deploy.outputs.enabled == 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          PORT: ${{ steps.deploy.outputs.port }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/elyndor_deploy
          chmod 600 ~/.ssh/elyndor_deploy

          if [[ -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H -p "$PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy release to VPS
        id: deploy_release
        if: >-
          steps.deploy.outputs.enabled == 'true' &&
          (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
        shell: bash
        env:
          PORT: ${{ steps.deploy.outputs.port }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          remote_archive="/tmp/elyndor-${revision}.tar.gz"
          remote_installer="/tmp/elyndor-install-${revision}.sh"
          ssh_args=(-i ~/.ssh/elyndor_deploy -p "$PORT" -o BatchMode=yes)
          scp_args=(-i ~/.ssh/elyndor_deploy -P "$PORT" -o BatchMode=yes)

          scp "${scp_args[@]}" artifacts/elyndor-linux-x64.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          scp "${scp_args[@]}" deploy/install-release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_installer"

          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set +e; chmod 700 '$remote_installer'; if [ \"\$(id -u)\" -eq 0 ]; then bash '$remote_installer' '$remote_archive'; else sudo -n bash '$remote_installer' '$remote_archive'; fi; status=\$?; if [ \$status -eq 0 ]; then test \"\$(cat /opt/elyndor/current/REVISION)\" = '$revision'; status=\$?; fi; rm -f '$remote_archive' '$remote_installer'; exit \$status"

          echo "Deployed Elyndor revision $revision to $DEPLOY_HOST"

      - name: Notify Telegram about deployment
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ELYNDOR_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.ELYNDOR_TELEGRAM_CHAT_IDS }}
          DEPLOY_OUTCOME: ${{ steps.deploy_release.outcome }}
          JOB_STATUS: ${{ job.status }}
          FALLBACK_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail

          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_IDS:-}" ]]; then
            echo "::notice::Telegram deploy notifications are not configured. Add ELYNDOR_TELEGRAM_BOT_TOKEN and ELYNDOR_TELEGRAM_CHAT_IDS repository secrets."
            exit 0
          fi

          revision="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$FALLBACK_REVISION")"
          short_revision="${revision:0:7}"
          subject="$(git log -1 --pretty=%s 2>/dev/null || printf '%s' 'Unknown revision')"
          actions_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "${DEPLOY_OUTCOME:-}" == "success" ]]; then
            message=$'🟢 Elyndor обновлён\n'
            message+="Версия: ${short_revision}"$'\n'
            message+="${subject}"$'\n'
            message+=$'Сервер: ✅ ready'
          elif [[ "${JOB_STATUS:-}" == "failure" ]]; then
            message=$'🔴 Elyndor: ошибка обновления\n'
            message+="Версия: ${short_revision}"$'\n'
            message+="${subject}"$'\n'
            message+="GitHub Actions: ${actions_url}"
          else
            echo "::notice::Deployment was not attempted; Telegram notification skipped."
            exit 0
          fi

          failed=0
          recipients=0
          IFS=',' read -ra chat_ids <<< "$TELEGRAM_CHAT_IDS"
          for raw_chat_id in "${chat_ids[@]}"; do
            chat_id="$(printf '%s' "$raw_chat_id" | tr -d '[:space:]')"
            [[ -z "$chat_id" ]] && continue
            recipients=$((recipients + 1))

            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${message}")" || http_code="000"

            if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::warning::Telegram notification failed for one recipient (HTTP ${http_code})."
              failed=1
            fi
            rm -f "$response_file"
          done

          if [[ "$recipients" -eq 0 ]]; then
            echo "::warning::ELYNDOR_TELEGRAM_CHAT_IDS does not contain any usable chat IDs."
            exit 1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "Telegram deployment notification sent to ${recipients} recipient(s)."
