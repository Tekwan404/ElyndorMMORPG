name: run combat client patch
on:
  push:
    branches:
      - fix/combat-dungeon-state-2026-09-11
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Disambiguate patch
        run: python3 tools/_fix_patch_script.py
      - name: Apply patch
        run: python3 tools/_patch_combat_client.py
      - name: Commit
        run: |
          rm tools/_fix_patch_script.py
          rm tools/_patch_combat_client.py
          rm .github/workflows/_run_combat_client_patch.yml
          git config user.name elyndor-fix-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix: queue skills and stabilize combat presentation'
          git push
