name: pve-session-patch

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-session-patch.yml

permissions:
  contents: write

jobs:
  patch-combat-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0

      - name: Apply exact CombatSession patch
        run: python3 tools/pve_patch_combat_session.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- src/Elyndor.Core/Combat/Sessions/CombatSession.cs

      - name: Commit branch wiring
        run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Sessions/CombatSession.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Sessions/CombatSession.cs
          git commit -m "Wire monster AI rules into CombatSession runtime"
          git push origin HEAD:codex/pve-mechanics-v022
