name: verify-content-startup-restore

on:
  push:
    branches:
      - fix/content-startup-restore-published-at

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: elyndor_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elyndor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: ContentPublication integration tests
        run: dotnet test tests/Elyndor.IntegrationTests/Elyndor.IntegrationTests.csproj --filter "FullyQualifiedName~ContentPublication"

      - name: Full solution tests
        run: dotnet test Elyndor.slnx

      - name: Validate content
        run: dotnet run --project tools/Elyndor.ContentValidator -- content/package.json
