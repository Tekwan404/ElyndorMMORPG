name: reconcile-raid-ef-snapshot

on:
  push:
    branches:
      - feat/raid-group-single-roster

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Elyndor.slnx

      - name: Build
        run: dotnet build Elyndor.slnx --configuration Release --no-restore

      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Scaffold snapshot probe
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add __RaidReadyStateSnapshotProbe \
            --project src/Elyndor.Infrastructure/Elyndor.Infrastructure.csproj \
            --startup-project src/Elyndor.Server/Elyndor.Server.csproj \
            --context GameDbContext \
            --configuration Release \
            --no-build

          probe_cs="$(find src/Elyndor.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name '*__RaidReadyStateSnapshotProbe.cs' ! -name '*.Designer.cs' -print -quit)"
          if [[ -z "${probe_cs}" ]]; then
            echo 'Snapshot probe migration was not generated.' >&2
            exit 1
          fi
          probe_designer="${probe_cs%.cs}.Designer.cs"

          python - "${probe_cs}" "${probe_designer}" <<'PY'
          from pathlib import Path
          import re
          import sys

          migration_path = Path(sys.argv[1])
          designer_path = Path(sys.argv[2])
          migration = migration_path.read_text(encoding='utf-8-sig')
          designer = designer_path.read_text(encoding='utf-8-sig')

          if migration.count('migrationBuilder.AddColumn') != 1 or migration.count('migrationBuilder.DropColumn') != 1:
              raise SystemExit('Unexpected EF model drift: probe contains operations beyond one AddColumn/DropColumn pair.')
          if 'name: "ReadyState"' not in migration or 'table: "raid_members"' not in migration:
              raise SystemExit('Unexpected EF model drift: probe is not the raid_members.ReadyState reconciliation.')

          match = re.search(r'\[Migration\("([^"]+)"\)\]', designer)
          if not match:
              raise SystemExit('Could not locate generated migration metadata.')
          designer = designer.replace(match.group(0), '[Migration("20260919044500_RaidLifecycleReadyState")]')
          designer = designer.replace('partial class __RaidReadyStateSnapshotProbe', 'partial class RaidLifecycleReadyState')
          target = Path('src/Elyndor.Infrastructure/Persistence/Migrations/20260919044500_RaidLifecycleReadyState.Designer.cs')
          target.write_text(designer, encoding='utf-8')
          PY

          rm -f "${probe_cs}" "${probe_designer}"

      - name: Commit generated EF metadata
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextProfessionModelSnapshot.cs \
            src/Elyndor.Infrastructure/Persistence/Migrations/20260919044500_RaidLifecycleReadyState.Designer.cs
          if git diff --cached --quiet; then
            echo 'No EF metadata changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reconcile raid ready state EF metadata'
          git push origin HEAD:feat/raid-group-single-roster
