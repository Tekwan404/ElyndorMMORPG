name: pve-generic-analyzer-fix

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-generic-analyzer-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_fix_generic_encounter_analyzers.py
      - run: |
          git diff --check
          git diff -- src/Elyndor.Core/Combat/Sessions/CombatSession.GenericEncounter.cs
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Sessions/CombatSession.GenericEncounter.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Sessions/CombatSession.GenericEncounter.cs
          git commit -m "Fix generic encounter runtime analyzer types"
          git push origin HEAD:codex/pve-mechanics-v022
