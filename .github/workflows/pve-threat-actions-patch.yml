name: pve-threat-actions-patch

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-threat-actions-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_patch_threat_actions.py
      - run: |
          git diff --check
          git diff -- src/Elyndor.Core/Combat/Abilities/AbilityEngine.cs src/Elyndor.Core/Content/Validation/GameContentPackageValidator.Abilities.cs src/Elyndor.Core/Combat/Sessions/CombatSession.Threat.cs
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Abilities/AbilityEngine.cs src/Elyndor.Core/Content/Validation/GameContentPackageValidator.Abilities.cs src/Elyndor.Core/Combat/Sessions/CombatSession.Threat.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Abilities/AbilityEngine.cs src/Elyndor.Core/Content/Validation/GameContentPackageValidator.Abilities.cs src/Elyndor.Core/Combat/Sessions/CombatSession.Threat.cs
          git commit -m "Wire explicit threat manipulation actions"
          git push origin HEAD:codex/pve-mechanics-v022
