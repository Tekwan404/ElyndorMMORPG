name: refresh-spatial-snapshot

on:
  push:
    branches:
      - feat/spatial-inventory-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: elyndor_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elyndor_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/spatial-inventory-v1
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Elyndor.slnx

      - name: Build
        run: dotnet build Elyndor.slnx --configuration Release --no-restore

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Refresh EF model snapshot
        env:
          ConnectionStrings__game: Host=127.0.0.1;Port=5432;Database=elyndor_e2e;Username=postgres;Password=postgres
          Database__MigrateOnStartup: "false"
          Content__RestorePublishedOnStartup: "false"
        run: |
          ~/.dotnet/tools/dotnet-ef migrations add __RefreshSpatialInventorySnapshot \
            --project src/Elyndor.Infrastructure/Elyndor.Infrastructure.csproj \
            --startup-project src/Elyndor.Server/Elyndor.Server.csproj \
            --context GameDbContext \
            --output-dir Persistence/Migrations \
            --no-build \
            --configuration Release
          find src/Elyndor.Infrastructure/Persistence/Migrations -maxdepth 1 -type f -name '*__RefreshSpatialInventorySnapshot*.cs' -delete
          if git diff --quiet -- src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextProfessionModelSnapshot.cs; then
            echo 'Active snapshot was not changed.' >&2
            exit 1
          fi

      - name: Align content-version assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/Elyndor.IntegrationTests/Content/GameContentPackageLoaderTests.cs')
          text = path.read_text()
          old = 'Assert.Equal("0.24.1", package.ContentVersion);'
          new = 'Assert.Equal("0.24.2", package.ContentVersion);'
          if old not in text:
              raise SystemExit('Expected old content-version assertion was not found.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Rebuild changed backend
        run: dotnet build Elyndor.slnx --configuration Release --no-restore

      - name: Test content root causes
        run: |
          dotnet test tests/Elyndor.UnitTests/Elyndor.UnitTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GameContentPackageValidatorTests"
          dotnet test tests/Elyndor.IntegrationTests/Elyndor.IntegrationTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~GameContentPackageLoaderTests"

      - name: Test full backend
        run: dotnet test Elyndor.slnx --configuration Release --no-build

      - name: Commit backend fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Elyndor.Infrastructure/Persistence/Migrations/GameDbContextProfessionModelSnapshot.cs \
            tests/Elyndor.IntegrationTests/Content/GameContentPackageLoaderTests.cs
          git commit -m "fix: stabilize spatial inventory backend tests"
          git push origin HEAD:feat/spatial-inventory-v1
