name: pve-replay-simulator-rename

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-replay-simulator-rename.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0
      - run: python3 tools/pve_rename_replay_simulator.py
      - run: git diff --check
      - run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Simulation/CombatScenarioSimulator.cs tests/Elyndor.UnitTests/Combat/CombatScenarioSimulatorTests.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Simulation/CombatScenarioSimulator.cs tests/Elyndor.UnitTests/Combat/CombatScenarioSimulatorTests.cs
          git commit -m "Separate replay simulator from aggregate simulator"
          git push origin HEAD:codex/pve-mechanics-v022
