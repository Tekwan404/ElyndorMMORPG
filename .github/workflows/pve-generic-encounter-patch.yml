name: pve-generic-encounter-patch

on:
  push:
    branches:
      - codex/pve-mechanics-v022
    paths:
      - .github/workflows/pve-generic-encounter-patch.yml

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pve-mechanics-v022
          fetch-depth: 0

      - name: Apply exact generic encounter patch
        run: python3 tools/pve_patch_generic_encounter.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- src/Elyndor.Core/Combat/Sessions/CombatSession.cs src/Elyndor.Infrastructure/Combat/CombatSessionFactory.cs

      - name: Commit runtime wiring
        run: |
          test -n "$(git status --porcelain -- src/Elyndor.Core/Combat/Sessions/CombatSession.cs src/Elyndor.Infrastructure/Combat/CombatSessionFactory.cs)"
          git config user.name "elyndor-pve-bot"
          git config user.email "elyndor-pve-bot@users.noreply.github.com"
          git add src/Elyndor.Core/Combat/Sessions/CombatSession.cs src/Elyndor.Infrastructure/Combat/CombatSessionFactory.cs
          git commit -m "Wire generic encounter runtime into combat session"
          git push origin HEAD:codex/pve-mechanics-v022
